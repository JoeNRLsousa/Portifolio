<script>
function seq(p,n,e){var a=[];for(var i=1;i<=n;i++)a.push(p+i+e);return a}
window.PROJETOS={
zine:{t:"Projeto Zine",d:"Um ZINE é um livreto, que contam histórias ou expressam algo sobre quem o fez. Esses pequenos livros fazem parte de um meio de expressão próprio, que diferencia-se de revistas e jornais convencionais, caracterizando-se pela sua ética \"faça você mesmo\". O zine pode abranger diversos tópicos, desde histórias pessoais até arte, música e poesia. A minha inspiração foi a partir de versos de músicas que são impactantes para mim. Escolhi 4 versos de 4 músicas diferentes, com um conceito mais reflexivo. A partir disso, criei componentes gráficos que dialogassem com a frase escolhida.",i:seq("assets/Zine/Prancheta ",5,"@5x.png")},
tempo:{t:"Linha do tempo",d:"Uma linha do tempo, contando um pouco sobre a minha história. Meus hobbyes, as coisas que eu mais gosto e gostava de fazer em cada época da minha vida. Transmitindo um pouco sobre quem eu sou, contando um pouco das coisas que formaram o Joe, o que me fizeram abrir portas para construir uma identidade própria!",i:["assets/Linha_tempo/Prancheta 15x.png","assets/Linha_tempo/Prancheta 25x.png"]},
heliz:{t:"Projeto Heliz",d:"Uma marca feita a partir da criação de formas misturadas, sobrepostas, repetidas. Foi um estudo para o despertar da criatividade, utilizando os 12 arquétipos de Carl Jung e 3 palavras escolhidas para ter um norte: caos, ruptura e continuidade.",i:seq("assets/Heliz/",10,".png")},
italla:{t:"Italla Victoria Psi",d:"Acolhimento, mudança prática, clareza e consciência são os valores da marca. Essa identidade visual foi construída para gerar confiança e segurança. A conexão com o paciente não é apenas quando se está em terapia, ela começa antes, com o primeiro olhar com quem irá ajudar e dar o devido suporte com seu problema. E é isso que a marca deseja entregar: desenvolver habilidades com segurança e acolhimento para sair do automático!",i:["assets/Italla_psi/Italla_landingPage_portifolio@300x.png"]}};
</script><script src="js/novo.js"></script></body></html>
